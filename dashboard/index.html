<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Bravonoid &mdash; DLMM LP Dashboard</title>
<style>
:root {
  --bg: #000000;
  --bg2: #080808;
  --card: #0a0a0a;
  --card2: #0f0f0f;
  --border: #1a1a1a;
  --border2: #2a2a2a;
  --text: #e8e8e8;
  --text2: #999999;
  --text3: #555555;
  --accent: #22c55e;
  --accent2: #16a34a;
  --accent-dim: rgba(34,197,94,.12);
  --accent2-dim: rgba(22,163,74,.1);
  --green: #22c55e;
  --green-bg: rgba(34,197,94,.1);
  --green-dim: rgba(34,197,94,.04);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,.1);
  --red-dim: rgba(239,68,68,.04);
  --yellow: #eab308;
  --yellow-bg: rgba(234,179,8,.1);
  --yellow-dim: rgba(234,179,8,.04);
  --radius: 10px;
  --radius-sm: 6px;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif;
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --glow: rgba(34,197,94,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 25%, rgba(34,197,94,.04) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 35%, rgba(22,163,74,.03) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 75%, rgba(34,197,94,.02) 0%, transparent 50%);
}
a{color:var(--accent);text-decoration:none}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
*{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}

/* ─── navbar ─── */
.navbar{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:54px;
  background:rgba(0,0,0,.85);backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--border);
}
.navbar::after{
  content:'';position:absolute;bottom:-1px;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.4;
}
.nav-left{display:flex;align-items:center;gap:4px;min-width:0}
.brand{
  font-size:1.12rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;cursor:pointer;padding:4px 14px 4px 4px;margin-right:2px;
}
.nav-link{
  font-size:.8rem;padding:5px 11px;border-radius:var(--radius-sm);
  color:var(--text2);transition:all .15s;white-space:nowrap;position:relative;
}
.nav-link:hover{color:var(--text);background:var(--accent-dim)}
.nav-link.active{color:var(--accent);background:var(--accent-dim)}
.nav-link.active::after{
  content:'';position:absolute;bottom:-1px;left:6px;right:6px;height:2px;
  background:var(--accent);border-radius:1px;
}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.sol-badge{
  display:flex;align-items:center;gap:5px;
  font-size:.8rem;font-weight:600;font-family:var(--mono);
  background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(251,191,36,.04));
  border:1px solid rgba(251,191,36,.2);border-radius:20px;
  padding:3px 13px;color:#fbbf24;white-space:nowrap;transition:border-color .2s;
}
.sol-badge:hover{border-color:rgba(251,191,36,.4)}
.sol-badge::before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.5);
}
.sse-status{width:7px;height:7px;border-radius:50%;transition:all .3s;flex-shrink:0}
.sse-status.connected{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.5)}
.sse-status.disconnected{background:#f87171;box-shadow:0 0 8px rgba(248,113,113,.5)}

/* ─── pages ─── */
.page{display:none;padding:14px 20px 40px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ─── stats bar ─── */
.stats-bar{
  display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:14px;
}
@media(max-width:960px){.stats-bar{grid-template-columns:repeat(4,1fr)}}
@media(max-width:540px){.stats-bar{grid-template-columns:repeat(2,1fr)}}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  text-align:center;transition:border-color .2s,box-shadow .2s,transform .15s;
  position:relative;overflow:hidden;
}
.stat-card:hover{
  border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.2);transform:translateY(-1px);
}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  border-radius:var(--radius) var(--radius) 0 0;
}
.stat-card:nth-child(1)::before{background:linear-gradient(90deg,#22c55e,#16a34a)}
.stat-card:nth-child(2)::before{background:linear-gradient(90deg,#4ade80,#22c55e)}
.stat-card:nth-child(3)::before{background:linear-gradient(90deg,#22c55e,#15803d)}
.stat-card:nth-child(4)::before{background:linear-gradient(90deg,#34d399,#059669)}
.stat-card:nth-child(5)::before{background:linear-gradient(90deg,#2dd4bf,#0d9488)}
.stat-card:nth-child(6)::before{background:linear-gradient(90deg,#14b8a6,#0f766e)}
.stat-card:nth-child(7)::before{background:linear-gradient(90deg,#4ade80,#16a34a)}

.stat-value{
  font-family:var(--mono);font-size:1rem;font-weight:700;line-height:1.2;
  display:flex;align-items:center;gap:6px;
}
.stat-pnl-pos{color:var(--green)}
.stat-pnl-neg{color:var(--red)}
.stat-label{font-size:.66rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:500}

/* win rate donut */
.stat-donut-wrap{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.stat-donut{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.stat-donut-mask{
  width:30px;height:30px;border-radius:50%;background:var(--card);
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:700;font-family:var(--mono);color:var(--text);
  position:relative;z-index:1;
}
.stat-icon{
  font-size:1rem;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border-radius:6px;
}
.stat-icon-pos{background:var(--accent-dim);color:var(--accent)}
.stat-icon-pnl{background:var(--green-bg);color:var(--green)}
.stat-icon-fees{background:rgba(52,211,153,.12);color:#34d399}
.stat-icon-time{background:rgba(45,212,191,.1);color:#2dd4bf}
.stat-icon-eff{background:rgba(20,184,166,.1);color:#14b8a6}
.stat-icon-best{background:rgba(74,222,128,.1);color:#4ade80}

/* ─── card ─── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  transition:border-color .25s,box-shadow .25s;margin-bottom:14px;
}
.card:hover{border-color:var(--border2);box-shadow:0 4px 24px rgba(0,0,0,.15)}
.card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;
}
.card-header h2{
  font-size:.86rem;font-weight:600;color:var(--text2);letter-spacing:.01em;
  display:flex;align-items:center;gap:8px;
}
.card-header h2::before{
  content:"";display:inline-block;width:3px;height:14px;
  border-radius:2px;background:linear-gradient(180deg,#22c55e,#16a34a);
}
.card-body{padding:0}
.refresh-badge{
  font-size:.7rem;padding:2px 10px;border-radius:10px;
  background:var(--accent-dim);color:var(--accent);font-weight:500;
}

/* ─── table ─── */
.data-table{width:100%;border-collapse:collapse;font-size:.785rem}
.data-table thead{background:var(--bg2)}
.data-table th{
  text-align:left;padding:7px 12px;font-weight:500;color:var(--text3);
  font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
}
.data-table td{padding:7px 12px;border-top:1px solid var(--border);white-space:nowrap}
.data-table tbody tr{transition:background .12s}
.data-table tbody tr:hover{background:var(--bg2)}
.data-table tbody tr:first-child td{border-top:none}
.history-reason{min-width:260px;white-space:normal!important;overflow-wrap:anywhere;line-height:1.45}
.table-empty td{text-align:center;padding:36px 16px;color:var(--text3);font-size:.85rem}

/* ─── mobile cards ─── */
.card-list{display:none;gap:7px;padding:8px}
.pos-card{
  background:var(--bg2);border-radius:var(--radius-sm);padding:10px 12px;
  border:1px solid var(--border);font-size:.76rem;
}
.pos-card .row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;gap:8px}
.pos-card .label{color:var(--text3);font-size:.7rem;white-space:nowrap}
.pos-card .value{font-family:var(--mono);font-size:.74rem;text-align:right;word-break:break-all}
.pos-card .history-reason{min-width:0;max-width:75%;white-space:normal!important}
.pos-card .pool-name{font-weight:600;font-size:.8rem;color:var(--text)}
.pos-card .divider{height:1px;background:var(--border);margin:5px 0}

@media(max-width:768px){
  .data-table{display:none}
  .card-list{display:flex;flex-direction:column}
}

/* ─── badges ─── */
.badge{
  display:inline-flex;align-items:center;gap:4px;font-size:.68rem;
  padding:2px 8px;border-radius:10px;font-weight:500;
}
.badge-inrange{background:var(--green-bg);color:var(--green)}
.badge-inrange::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--green)}
.badge-oor{background:var(--red-bg);color:var(--red)}
.badge-oor::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
.badge-closed{background:var(--yellow-bg);color:var(--yellow)}
.badge-closed::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.pnl-pos{color:var(--green);font-weight:600}
.pnl-neg{color:var(--red);font-weight:600}
.pnl-zero{color:var(--text3)}
.strategy-badge{
  font-size:.65rem;padding:1px 7px;border-radius:4px;
  background:rgba(34,197,94,.1);color:var(--accent);text-transform:uppercase;font-weight:500;
}
.range-eff-badge{
  font-size:.68rem;padding:2px 8px;border-radius:4px;font-weight:500;
}
.range-eff-high{background:var(--green-bg);color:var(--green)}
.range-eff-mid{background:var(--yellow-bg);color:var(--yellow)}
.range-eff-low{background:var(--red-bg);color:var(--red)}

/* ─── empty state ─── */
.empty-state{display:none;flex-direction:column;align-items:center;padding:44px 20px;color:var(--text3)}
.empty-state.show{display:flex}
.empty-state .icon{font-size:1.6rem;margin-bottom:6px;opacity:.35}
.empty-state p{font-size:.82rem}

/* ─── terminal ─── */
.terminal-card .card-body{padding:0}
.terminal-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.terminal-controls select{
  background:var(--bg2);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:4px 10px;font-size:.73rem;
  font-family:var(--mono);cursor:pointer;max-width:240px;
}
.terminal-controls select:focus{outline:none;border-color:var(--accent)}
.auto-scroll-toggle{
  display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--text3);cursor:pointer;user-select:none;
}
.auto-scroll-toggle input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer}
#logOutput{
  background:#000;color:#c9d1d9;font-family:var(--mono);
  font-size:clamp(10px,2vw,12.5px);line-height:1.55;
  padding:12px 14px;overflow:auto;max-height:400px;min-height:120px;
  white-space:pre-wrap;word-break:break-all;tab-size:4;
}
.terminal-placeholder{color:var(--text3);font-size:.78rem}
.log-ts{color:#555}
.log-cat{font-weight:600}
.log-cat-error,.log-cat-close{color:#ef4444}
.log-cat-warn{color:#eab308}
.log-cat-deploy,.log-cat-claim{color:#22c55e}
.log-cat-swap{color:#4ade80}
.log-cat-cron{color:#34d399}
.log-cat-agent{color:#14b8a6}
.log-cat-info{color:#22c55e}
.log-cat-rebalance{color:#f87171}
.log-cat-position{color:#2dd4bf}
.log-cat-state{color:#eab308}
.log-cat-telegram{color:#22c55e}
.log-cat-screening{color:#4ade80}
.log-cat-pnl{color:#fbbf24}

/* ─── pagination ─── */
.pagination{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:10px 16px;border-top:1px solid var(--border);
  font-size:.75rem;color:var(--text3);
}
.pagination .page-btn{
  padding:4px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg2);color:var(--text2);cursor:pointer;font-size:.72rem;
  transition:all .15s;font-family:var(--mono);user-select:none;
}
.pagination .page-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.pagination .page-btn:disabled{opacity:.3;cursor:default;border-color:var(--border);color:var(--text3);background:var(--bg2)}
.pagination .page-info{font-family:var(--mono);font-size:.7rem;color:var(--text3);min-width:80px;text-align:center}

/* ─── config page ─── */
.config-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.config-section{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  transition:border-color .2s;
}
.config-section:hover{border-color:var(--border2)}
.config-section-header{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-bottom:1px solid var(--border);
  font-size:.8rem;font-weight:600;color:var(--text2);
}
.config-section-header .icon{font-size:.95rem}
.config-section-body{padding:6px 14px 8px}
.config-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 0;border-bottom:1px solid rgba(26,38,66,.5);gap:12px;
}
.config-row:last-child{border-bottom:none}
.config-key{font-size:.75rem;color:var(--text2);font-family:var(--mono);word-break:break-all}
.config-val{
  font-size:.77rem;font-weight:500;color:var(--text);font-family:var(--mono);
  text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;
}
.config-val.array{color:var(--yellow);font-size:.7rem;white-space:normal;word-break:break-all;max-width:240px}
.config-val.boolean{font-weight:600}
.config-val.boolean.true{color:var(--green)}
.config-val.boolean.false{color:var(--text3)}
.config-object{border-bottom:1px solid rgba(26,38,66,.5)}
.config-object:last-child{border-bottom:none}
.config-object summary{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:5px 0;cursor:pointer;list-style:none;color:var(--text2);
}
.config-object summary::-webkit-details-marker{display:none}
.config-object summary::after{content:'+';font-family:var(--mono);color:var(--text3);font-size:.8rem}
.config-object[open] summary::after{content:'-'}
.config-object-title{font-size:.75rem;font-family:var(--mono);word-break:break-all}
.config-object-count{margin-left:auto;font-size:.66rem;color:var(--text3);font-family:var(--mono);white-space:nowrap}
.config-object-body{margin:0 0 6px 8px;padding-left:10px;border-left:1px solid var(--border)}
.config-object-body .config-row{padding:3px 0}

/* ─── utility ─── */
.text-mono{font-family:var(--mono)}
.text-sm{font-size:.73rem}
.text-xs{font-size:.66rem}
.text-muted{color:var(--text3)}
.mt-8{margin-top:8px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-100{width:100%}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="brand" onclick="navigate('dashboard')">Bravonoid</span>
    <a href="#dashboard" class="nav-link active" data-page="dashboard">Dashboard</a>
    <a href="#config" class="nav-link" data-page="config">Config</a>
  </div>
  <div class="nav-right">
    <span class="sol-badge" id="solBalance">◎ <span id="balanceValue">0.00</span></span>
    <span class="sse-status disconnected" id="sseStatus" title="Log stream"></span>
  </div>
</nav>

<div id="page-dashboard" class="page active">

  <div class="stats-bar" id="statsBar"></div>

  <section class="card">
    <div class="card-header">
      <h2>Active Positions</h2>
      <span class="refresh-badge" id="positionsCount">0</span>
    </div>
    <div class="card-body">
      <table class="data-table" id="positionsTable">
        <thead><tr>
          <th>Pool</th><th>Strategy</th><th>Amount</th><th>PnL</th><th>Range</th><th>Bins</th><th>Fees</th><th>Status</th><th>Age</th>
        </tr></thead>
        <tbody id="positionsBody"></tbody>
      </table>
      <div class="card-list" id="positionsCards"></div>
      <div class="empty-state" id="positionsEmpty">
        <div class="icon">○</div>
        <p>No active positions</p>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2>History</h2>
      <span class="refresh-badge" id="historyCount">0</span>
    </div>
    <div class="card-body">
      <table class="data-table" id="historyTable">
        <thead><tr>
          <th>Pool</th><th>Strategy</th><th>Amount</th><th>Bins</th><th>PnL</th><th>PnL %</th><th>Hold</th><th>Fees</th><th>R.Eff</th><th>Reason</th>
        </tr></thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div class="card-list" id="historyCards"></div>
      <div class="pagination" id="historyPagination" style="display:none">
        <button class="page-btn" id="historyPrev">← Prev</button>
        <span class="page-info" id="historyPageInfo"></span>
        <button class="page-btn" id="historyNext">Next →</button>
      </div>
      <div class="empty-state" id="historyEmpty">
        <div class="icon">○</div>
        <p>No position history yet</p>
      </div>
    </div>
  </section>

  <section class="card terminal-card">
    <div class="card-header">
      <h2>Terminal Log</h2>
      <div class="terminal-controls">
        <select id="logFileSelect"></select>
        <label class="auto-scroll-toggle">
          <input type="checkbox" id="autoScroll" checked/>
          <span>Auto-scroll</span>
        </label>
      </div>
    </div>
    <div class="card-body">
      <pre id="logOutput"><span class="terminal-placeholder">Connecting to log stream...</span></pre>
    </div>
  </section>
</div>

<div id="page-config" class="page">
  <div class="config-grid" id="configContent"></div>
</div>

<script>
// ─── state ───
let currentPage = 'dashboard';
let currentSSE = null;
let selectedLogFile = '';
let appConfig = { solMode: false, maxPositions: 3 };
let lastStats = null;
let fullHistoryData = [];
let historyPage = 0;
const HISTORY_PER_PAGE = 10;

const CONFIG_GROUPS = {
  'Preset':     ['preset','strategy','minBinsBelow','maxBinsBelow','solMode','dryRun'],
  'Momentum':   ['momentumStrongThreshold','momentumStrongMinBins','momentumStrongMaxBins','momentumWeakMinBins','momentumWeakMaxBins','momentumMaxCandleAgeMinutes','momentumMaxRetries','momentumRetryDelayMs'],
  'Risk':       ['maxPositions','maxDeployAmount','stopLossPct','emergencyPriceDropPct'],
  'Screening':  ['timeframe','category','minTvl','maxTvl','minVolume','minVolumeToActiveTvlRatio','minMomentumScore','minOrganic','minHolders','minMcap','maxMcap','minBinStep','maxBinStep','minFeeActiveTvlRatio','minTokenFeesSol','maxBotHoldersPct','maxTop10Pct','blockedLaunchpads','allowedLaunchpads','minTokenAgeHours','maxTokenAgeHours','athFilterPct'],
  'Deploy':     ['deployAmountSol','minSolToOpen','gasReserve','positionSizePct'],
  'Management': ['minClaimAmount','autoSwapAfterClaim','outOfRangeBinsToClose','outOfRangeWaitMinutes','minVolumeToRebalance','takeProfitFeePct','minFeePerTvl24h','minAgeBeforeYieldCheck','trailingTakeProfit','trailingTriggerPct','trailingDropPct','whaleGuardEnabled','whaleGuardMinDropUsd','whaleGuardMinDropPct'],
  'Schedule':   ['managementIntervalMin','screeningIntervalMin','healthCheckIntervalMin'],
  'LLM':        ['temperature','maxTokens','maxSteps','managementModel','screeningModel','generalModel'],
};

// ─── nav ───
function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-link').forEach(el =>
    el.classList.toggle('active', el.dataset.page === page));
  window.location.hash = page;
  if (page === 'config') loadConfigPage();
}

window.addEventListener('hashchange', () => {
  const p = window.location.hash.replace('#','') || 'dashboard';
  if (p !== currentPage) navigate(p);
});

// ─── fetch ───
async function getJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw Error(r.status);
    return await r.json();
  } catch { return null; }
}

// ─── format ───
function fmtPnL(val) {
  if (val == null || isNaN(val)) return '<span class="pnl-zero">-</span>';
  const n = Number(val);
  const cls = n > 0 ? 'pnl-pos' : n < 0 ? 'pnl-neg' : 'pnl-zero';
  const formatted = n.toFixed(8).replace(/\.?0+$/, '');
  return `<span class="${cls}">${n > 0 ? '+' : ''}${formatted}</span>`;
}
function fmtPnLPct(val) {
  if (val == null || isNaN(val)) return '<span class="pnl-zero">-</span>';
  const n = Number(val);
  const cls = n > 0 ? 'pnl-pos' : n < 0 ? 'pnl-neg' : 'pnl-zero';
  return `<span class="${cls}">${n > 0 ? '+' : ''}${n.toFixed(4)}%</span>`;
}
function fmtSolAmount(val) {
  const n = Number(val);
  return Number.isFinite(n) ? n.toFixed(2) + ' SOL' : '0.00 SOL';
}
function fmtPct(v) {
  if (v == null || isNaN(v)) return '-';
  const abs = Math.abs(v);
  const sign = v >= 0 ? '+' : '-';
  if (abs === 0) return '0%';
  if (abs >= 0.01) return sign + abs.toFixed(4) + '%';
  const str = abs.toFixed(12);
  const dec = str.split('.')[1] || '';
  let z = 0;
  while (z < dec.length && dec[z] === '0') z++;
  const sig = dec.slice(z).replace(/0+$/, '');
  if (z > 0 && sig.length > 0) {
    const sub = String.fromCharCode(0x2080 + z);
    return sign + '0.0' + sub + sig + '%';
  }
  return sign + abs.toFixed(4) + '%';
}
function fmtAge(iso) {
  if (!iso) return '-';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 0) return '0m';
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? h + 'h ' + m + 'm' : h + 'h';
}
function fmtHold(mins) {
  if (mins == null) return '-';
  if (mins < 60) return mins + 'm';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? h + 'h ' + m + 'm' : h + 'h';
}
function fmtNum(n) {
  if (n == null || isNaN(n)) return '0';
  if (Math.abs(n) >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toFixed(2);
}
function stratBadge(s) { return '<span class="strategy-badge">' + (s||'?') + '</span>'; }
function shortAddr(a) { return a ? a.slice(0,4)+'..'+a.slice(-4) : '?'; }
function statusBadge(p) {
  if (p.out_of_range_since) return '<span class="badge badge-oor">OOR</span>';
  return '<span class="badge badge-inrange">In Range</span>';
}
function rangeEffBadge(v) {
  if (v == null) return '-';
  if (v >= 65) return '<span class="range-eff-badge range-eff-high">'+v.toFixed(0)+'%</span>';
  if (v >= 40) return '<span class="range-eff-badge range-eff-mid">'+v.toFixed(0)+'%</span>';
  return '<span class="range-eff-badge range-eff-low">'+v.toFixed(0)+'%</span>';
}
function binsCount(br) {
  if (br == null) return null;
  if (typeof br === 'object' && br.min != null && br.max != null) return Math.abs(br.max - br.min);
  return br;
}

// ─── stats ───
function computeStats(positions, history) {
  const active = positions.length;
  const total = history.length;
  const winners = history.filter(p => (p.pnl_sol||0) > 0).length;
  const winRate = total > 0 ? winners / total * 100 : 0;
  const totalPnlSol = history.reduce((s,p) => s + (p.pnl_sol||0), 0);
  const totalFeesSol = history.reduce((s,p) => s + (p.fees_earned_sol||0), 0);
  const avgMins = total > 0 ? history.reduce((s,p) => s + (p.minutes_held||0), 0) / total : 0;
  const avgEff = total > 0 ? history.reduce((s,p) => s + (p.range_efficiency||0), 0) / total : 0;
  const bestPnl = total > 0 ? Math.max(...history.map(p => p.pnl_pct||0)) : 0;
  return { active, max: appConfig.maxPositions, winRate, totalPnl: totalPnlSol, totalFees: totalFeesSol, avgMins, avgEff, bestPnl, total };
}

function renderStats(stats) {
  lastStats = stats;
  const pnlCls = stats.totalPnl >= 0 ? 'stat-pnl-pos' : 'stat-pnl-neg';
  const pnlIcon = stats.totalPnl >= 0 ? '↗' : '↘';
  const winDeg = stats.winRate * 3.6;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${stats.active}<span style="color:var(--text3);font-size:.75rem">/${stats.max}</span></div>
      <div class="stat-label">Positions</div>
    </div>
    <div class="stat-card">
      <div class="stat-donut-wrap">
        <div class="stat-donut" style="background:conic-gradient(var(--green) 0deg ${winDeg}deg, var(--red-dim) ${winDeg}deg 360deg)">
          <div class="stat-donut-mask">${stats.winRate.toFixed(0)}%</div>
        </div>
      </div>
      <div class="stat-label">Win Rate</div>
    </div>
    <div class="stat-card">
      <div class="stat-value ${pnlCls}"><span class="stat-icon stat-icon-pnl">${pnlIcon}</span>${stats.totalPnl >= 0 ? '+' : ''}◎${fmtPnL(stats.totalPnl).replace(/<\/?span[^>]*>/g,'')}</div>
      <div class="stat-label">Total PnL</div>
    </div>
    <div class="stat-card">
      <div class="stat-value"><span class="stat-icon stat-icon-fees">⚡</span>◎${fmtPnL(stats.totalFees).replace(/<\/?span[^>]*>/g,'')}</div>
      <div class="stat-label">Fees Earned</div>
    </div>
    <div class="stat-card">
      <div class="stat-value"><span class="stat-icon stat-icon-time">⏱</span>${fmtHold(Math.round(stats.avgMins))}</div>
      <div class="stat-label">Avg Hold</div>
    </div>
    <div class="stat-card">
      <div class="stat-value"><span class="stat-icon stat-icon-eff">◈</span>${stats.avgEff.toFixed(0)}%</div>
      <div class="stat-label">Avg R.Efficiency</div>
    </div>
    <div class="stat-card">
      <div class="stat-value stat-pnl-pos"><span class="stat-icon stat-icon-best">★</span>+${stats.bestPnl.toFixed(1)}%</div>
      <div class="stat-label">Best Trade</div>
    </div>`;
}

// ─── render positions ───
function renderPositions(list) {
  document.getElementById('positionsCount').textContent = list.length;
  const empty = document.getElementById('positionsEmpty');
  if (!list.length) {
    empty.classList.add('show');
    document.getElementById('positionsBody').innerHTML = '';
    document.getElementById('positionsCards').innerHTML = '';
    return;
  }
  empty.classList.remove('show');

  document.getElementById('positionsBody').innerHTML = list.map(p => {
    const bins = p.bin_range ? Math.abs(p.bin_range.max - p.bin_range.min) : null;
    const pnlSol = p.pnl_sol != null ? Number(p.pnl_sol) : null;
    const pnlPct = p.pnl_pct != null ? Number(p.pnl_pct) : null;
    return `<tr>
    <td><strong>${p.pool_name||shortAddr(p.pool)}</strong></td>
    <td>${stratBadge(p.strategy)}</td>
    <td class="text-mono">${(p.amount_sol||0).toFixed(2)} SOL</td>
    <td class="text-mono text-xs">${pnlSol != null ? fmtPnL(pnlSol) + (pnlPct != null ? ' ◎' : '') : '-'}${pnlPct != null ? ' ' + '<span class="'+(pnlPct>=0?'pnl-pos':'pnl-neg')+'">'+fmtPct(pnlPct)+'</span>' : ''}</td>
    <td class="text-mono text-xs">${p.bin_range ? p.bin_range.min+'-'+p.bin_range.max : '-'}</td>
    <td class="text-mono text-xs">${bins != null ? bins : '-'}</td>
    <td class="text-mono text-xs">${p.unclaimed_fees_sol != null ? '◎'+p.unclaimed_fees_sol : '-'}</td>
    <td>${statusBadge(p)}</td>
    <td class="text-mono text-xs">${fmtAge(p.deployed_at)}</td>
  </tr>`}).join('');

  document.getElementById('positionsCards').innerHTML = list.map(p => {
    const bins = p.bin_range ? Math.abs(p.bin_range.max - p.bin_range.min) : null;
    const pnlSol = p.pnl_sol != null ? Number(p.pnl_sol) : null;
    const pnlPct = p.pnl_pct != null ? Number(p.pnl_pct) : null;
    return `<div class="pos-card">
    <div class="row"><span class="pool-name">${p.pool_name||shortAddr(p.pool)}</span>${stratBadge(p.strategy)}</div>
    <div class="divider"></div>
    <div class="row"><span class="label">Amount</span><span class="value">${(p.amount_sol||0).toFixed(2)} SOL</span></div>
    <div class="row"><span class="label">PnL</span><span class="value text-xs">${pnlSol != null ? fmtPnL(pnlSol) + (pnlPct != null ? ' ◎' : '') : '-'}${pnlPct != null ? ' ' + '<span class="'+(pnlPct>=0?'pnl-pos':'pnl-neg')+'">'+fmtPct(pnlPct)+'</span>' : ''}</span></div>
    <div class="row"><span class="label">Range</span><span class="value text-xs">${p.bin_range ? p.bin_range.min+'-'+p.bin_range.max : '-'}</span></div>
    <div class="row"><span class="label">Bins</span><span class="value text-xs">${bins != null ? bins : '-'}</span></div>
    <div class="row"><span class="label">Fees</span><span class="value">${p.unclaimed_fees_sol != null ? '◎'+p.unclaimed_fees_sol : '-'}</span></div>
    <div class="row"><span class="label">Status</span><span>${statusBadge(p)}</span></div>
    <div class="row"><span class="label">Age</span><span class="value text-xs">${fmtAge(p.deployed_at)}</span></div>
  </div>`}).join('');
}

// ─── render history ───
function renderHistory(list) {
  fullHistoryData = list;
  const total = list.length;
  document.getElementById('historyCount').textContent = total;
  const empty = document.getElementById('historyEmpty');
  const pag = document.getElementById('historyPagination');

  if (!total) {
    empty.classList.add('show');
    document.getElementById('historyBody').innerHTML = '';
    document.getElementById('historyCards').innerHTML = '';
    pag.style.display = 'none';
    return;
  }
  empty.classList.remove('show');

  const maxPage = Math.max(0, Math.ceil(total / HISTORY_PER_PAGE) - 1);
  if (historyPage > maxPage) historyPage = maxPage;

  const start = historyPage * HISTORY_PER_PAGE;
  const end = Math.min(start + HISTORY_PER_PAGE, total);
  const pageItems = list.slice(start, end);

  document.getElementById('historyBody').innerHTML = pageItems.map(p => `<tr>
    <td><strong>${p.pool_name||'-'}</strong></td>
    <td>${stratBadge(p.strategy)}</td>
    <td class="text-mono">${fmtSolAmount(p.amount_sol)}</td>
    <td class="text-mono text-xs">${binsCount(p.bin_range) != null ? binsCount(p.bin_range) : '-'}</td>
    <td class="text-mono">${fmtPnL(p.pnl_sol)}</td>
    <td class="text-mono">${fmtPnLPct(p.pnl_pct)}</td>
    <td class="text-mono text-xs">${fmtHold(p.minutes_held)}</td>
    <td class="text-mono text-xs">${p.fees_earned_sol != null && p.fees_earned_sol !== 0 ? '◎'+p.fees_earned_sol : '-'}</td>
    <td>${rangeEffBadge(p.range_efficiency)}</td>
    <td class="text-xs history-reason">${p.close_reason||'-'}</td>
  </tr>`).join('');

  document.getElementById('historyCards').innerHTML = pageItems.map(p => `<div class="pos-card">
    <div class="row"><span class="pool-name">${p.pool_name||'-'}</span>${stratBadge(p.strategy)}</div>
    <div class="divider"></div>
    <div class="row"><span class="label">Amount</span><span class="value">${fmtSolAmount(p.amount_sol)}</span></div>
    <div class="row"><span class="label">PnL</span><span class="value">${fmtPnL(p.pnl_sol)} (${fmtPnLPct(p.pnl_pct)})</span></div>
    <div class="row"><span class="label">Bins</span><span class="value text-xs">${binsCount(p.bin_range) != null ? binsCount(p.bin_range) : '-'}</span></div>
    <div class="row"><span class="label">Hold</span><span class="value text-xs">${fmtHold(p.minutes_held)}</span></div>
    <div class="row"><span class="label">Fees</span><span class="value">${p.fees_earned_sol != null && p.fees_earned_sol !== 0 ? '◎'+p.fees_earned_sol : '-'}</span></div>
    <div class="row"><span class="label">R.Eff</span><span>${rangeEffBadge(p.range_efficiency)}</span></div>
    <div class="row"><span class="label">Reason</span><span class="value text-xs history-reason">${p.close_reason||'-'}</span></div>
  </div>`).join('');

  if (total > HISTORY_PER_PAGE) {
    pag.style.display = 'flex';
    document.getElementById('historyPrev').disabled = historyPage === 0;
    document.getElementById('historyNext').disabled = historyPage >= maxPage;
    document.getElementById('historyPageInfo').textContent = (historyPage + 1) + '/' + (maxPage + 1) + ' (' + start + '-' + end + '/' + total + ')';
  } else {
    pag.style.display = 'none';
  }
}

function historyPrevPage() {
  if (historyPage > 0) { historyPage--; renderHistory(fullHistoryData); }
}
function historyNextPage() {
  const maxPage = Math.max(0, Math.ceil(fullHistoryData.length / HISTORY_PER_PAGE) - 1);
  if (historyPage < maxPage) { historyPage++; renderHistory(fullHistoryData); }
}

// ─── config ───
function renderConfig(data) {
  if (!data || !Object.keys(data).length) {
    document.getElementById('configContent').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:var(--text3)">No configuration loaded</div>';
    return;
  }
  const assigned = new Set();
  let html = '';
  for (const [group, keys] of Object.entries(CONFIG_GROUPS)) {
    const rows = [];
    for (const k of keys) {
      if (k in data) { assigned.add(k); rows.push(confRow(k, data[k])); }
    }
    if (!rows.length) continue;
    html += `<div class="config-section"><div class="config-section-header"><span class="icon">${groupIcon(group)}</span>${group}</div><div class="config-section-body">${rows.join('')}</div></div>`;
  }
  const rest = Object.keys(data).filter(k => !assigned.has(k));
  if (rest.length) {
    html += `<div class="config-section"><div class="config-section-header"><span class="icon">⚙</span>Other</div><div class="config-section-body">${rest.map(k => confRow(k, data[k])).join('')}</div></div>`;
  }
  document.getElementById('configContent').innerHTML = html;
}
function groupIcon(g) {
  const icons = {Preset:'🎯',Strategy:'📐',Risk:'🛡',Screening:'🔍',Deploy:'🚀',Management:'⚙',Schedule:'⏱',LLM:'🧠'};
  return icons[g]||'📋';
}
function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
function confRow(key, val) {
  if (val && typeof val === 'object' && !Array.isArray(val)) {
    const entries = Object.entries(val);
    const count = entries.length;
    const label = count === 1 ? 'setting' : 'settings';
    return `<details class="config-object">
      <summary><span class="config-object-title">${escapeHtml(key)}</span><span class="config-object-count">${count} ${label}</span></summary>
      <div class="config-object-body">${entries.map(([childKey, childVal]) => confRow(childKey, childVal)).join('')}</div>
    </details>`;
  }
  let display = val, cls = '';
  if (typeof val === 'boolean') { display = val ? 'true' : 'false'; cls = 'boolean ' + display; }
  else if (Array.isArray(val)) { display = val.length ? val.join(', ') : '[]'; cls = 'array'; }
  else if (typeof val === 'string' && val.length > 40) { display = val.slice(0,37)+'...'; }
  else if (val === null || val === undefined) { display = 'null'; cls = 'text-muted'; }
  return `<div class="config-row"><span class="config-key">${escapeHtml(key)}</span><span class="config-val ${cls}">${escapeHtml(display)}</span></div>`;
}

async function loadConfigPage() {
  const data = await getJSON('/api/config');
  renderConfig(data);
}

// ─── balance ───
async function fetchBalance() {
  const d = await getJSON('/api/balance');
  if (d && typeof d.balance === 'number') {
    document.getElementById('balanceValue').textContent = d.balance.toFixed(2);
  }
}

// ─── refresh dashboard data ───
async function refreshData() {
  const [pos, hist] = await Promise.all([getJSON('/api/positions'), getJSON('/api/history')]);
  if (pos != null && hist != null) {
    renderPositions(pos);
    renderHistory(hist);
    const stats = computeStats(pos, hist);
    renderStats(stats);
  }
}

// ─── logs ───
async function refreshLogList() {
  const files = await getJSON('/api/logs');
  if (!files || !files.length) return;
  const sel = document.getElementById('logFileSelect');
  const cur = sel.value || files[0];
  sel.innerHTML = files.map(f => `<option value="${f}">${f}</option>`).join('');
  sel.value = cur;
  if (!sel.value) { sel.value = files[0]; }
  if (selectedLogFile !== sel.value) {
    selectedLogFile = sel.value;
    connectSSE(sel.value);
  }
}

function connectSSE(file) {
  if (currentSSE) { currentSSE.close(); currentSSE = null; }
  const out = document.getElementById('logOutput');
  const st = document.getElementById('sseStatus');
  out.innerHTML = '<span class="terminal-placeholder">Connecting to ' + file + '...</span>';

  const es = new EventSource('/api/logs/stream?file=' + encodeURIComponent(file));
  currentSSE = es;

  es.addEventListener('full', e => {
    try {
      const c = JSON.parse(e.data);
      out.innerHTML = colorizeLog(c);
      if (document.getElementById('autoScroll').checked) scrollLog();
      st.className = 'sse-status connected';
    } catch {}
  });
  es.addEventListener('append', e => {
    try {
      out.innerHTML += colorizeLog(JSON.parse(e.data));
      if (document.getElementById('autoScroll').checked) scrollLog();
    } catch {}
  });
  es.addEventListener('error', () => {
    st.className = 'sse-status disconnected';
  });
  es.onopen = () => { st.className = 'sse-status connected'; };
}

function scrollLog() {
  const el = document.getElementById('logOutput');
  el.scrollTop = el.scrollHeight;
}

function toWITA(iso) {
  const d = new Date(iso);
  d.setTime(d.getTime() + 8 * 3600000);
  return d.toISOString().replace('Z','');
}
function colorizeLog(text) {
  let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h = h.replace(/\[(\d{4}-\d{2}-\d{2}T[^\]]+)\]\s*\[(\w+)\]/g, (m, ts, cat) => {
    const c = cat.toLowerCase();
    const wita = toWITA(ts);
    return `<span class="log-ts">[${wita}]</span> <span class="log-cat log-cat-${c}">[${cat}]</span>`;
  });
  return h;
}

// ─── init config ───
async function initAppConfig() {
  const data = await getJSON('/api/config');
  if (data) {
    appConfig.solMode = !!data.solMode;
    appConfig.maxPositions = data.maxPositions ?? 3;
  }
}

// ─── events ───
document.getElementById('historyPrev').addEventListener('click', historyPrevPage);
document.getElementById('historyNext').addEventListener('click', historyNextPage);
document.getElementById('logFileSelect').addEventListener('change', e => {
  if (e.target.value && e.target.value !== selectedLogFile) {
    selectedLogFile = e.target.value;
    connectSSE(selectedLogFile);
  }
});
document.getElementById('autoScroll').addEventListener('change', () => {
  if (document.getElementById('autoScroll').checked) scrollLog();
});

// ─── bootstrap ───
const hash = window.location.hash.replace('#','') || 'dashboard';
if (hash !== 'dashboard') navigate(hash);

document.getElementById('statsBar').innerHTML =
  '<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--text3);font-size:.82rem">Loading stats...</div>';

initAppConfig().then(() => {
  refreshData();
});
fetchBalance();
refreshLogList();

// SSE: instant position updates when agent's 30s poller writes cache
function connectPositionsSSE() {
  const es = new EventSource('/api/positions/stream');
  es.onmessage = () => refreshData();
  es.onerror = () => {}; // auto-reconnect by EventSource
}
connectPositionsSSE();

// Polling fallback (cache reads are local — near-zero cost)
setInterval(refreshData, 5000);
setInterval(fetchBalance, 30000);
setInterval(refreshLogList, 30000);
</script>
